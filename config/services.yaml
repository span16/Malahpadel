# services.yaml

parameters:
    # Définissez ici vos clés reCAPTCHA
    recaptcha.site_key: '%env(RECAPTCHA_SITE_KEY)%'
    recaptcha.secret_key: '%env(RECAPTCHA_SECRET_KEY)%'
    
  

    avatars_directory: '%kernel.project_dir%/public/uploads/avatars'

services:
   
    # Default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Makes classes in src/ available to be used as services
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Recaptcha service configuration
    App\Service\RecaptchaService:
        arguments:
            $client: '@http_client'  # Symfony HttpClient service
            $secretKey: '%env(RECAPTCHA_SECRET_KEY)%'  # Inject the reCAPTCHA secret key from .env


    App\Service\ParameterService:
        arguments:
            $parameterBag: '@parameter_bag'


      # Service pour la gestion des utilisateurs via OAuth
   
   
   